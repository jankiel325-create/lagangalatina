name: Sonix weekly listener
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python sonix-listener/listen.py
      - run: |
          git config user.name "sonix-listener[bot]"
          git config user.email "sonix-listener[bot]@users.noreply.github.com"
          git add sonix-listener/weekly-report.json
          git diff --cached --quiet || git commit -m "Update Sonix weekly listening report"
          git push
